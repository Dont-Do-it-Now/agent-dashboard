<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Agent Dashboard real CLI output examples</title>
  <desc id="desc">Two terminal panels showing the captured Claude Code statusline output and the Codex shared renderer preview.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <filter id="shadow"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1600" height="760" fill="url(#bg)"/>
  <text x="90" y="78" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="42" font-weight="700">Agent Dashboard</text>
  <text x="90" y="116" fill="#a5b4fc" font-family="Segoe UI,Arial,sans-serif" font-size="20">Captured CLI output • no product mockup</text>
  <rect x="70" y="155" width="1460" height="535" rx="18" fill="#020617" opacity=".65" filter="url(#shadow)"/>
  <rect x="70" y="145" width="1460" height="535" rx="18" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <circle cx="103" cy="180" r="8" fill="#fb7185"/><circle cx="130" cy="180" r="8" fill="#facc15"/><circle cx="157" cy="180" r="8" fill="#4ade80"/>
  <text x="195" y="188" fill="#94a3b8" font-family="Consolas,monospace" font-size="18">agent-dashboard terminal</text>
  <line x1="800" y1="220" x2="800" y2="635" stroke="#334155" stroke-width="2"/>
  <text x="110" y="250" fill="#67e8f9" font-family="Consolas,monospace" font-size="22">Claude Code 2.1.332 • statusLine.command</text>
  <text x="110" y="308" fill="#f8fafc" font-family="Consolas,monospace" font-size="22">$ node dist/index.js &lt; claude-input.json</text>
  <rect x="105" y="350" width="650" height="100" rx="10" fill="#111827" stroke="#334155"/>
  <text x="125" y="408" fill="#67e8f9" font-family="Consolas,monospace" font-size="22">◆ Agent Model │ 5h: 68% (0m) │ 7d: 41%</text>
  <text x="125" y="438" fill="#86efac" font-family="Consolas,monospace" font-size="22">███░░░░░░░ │ 32% │ 64K/200K</text>
  <text x="110" y="500" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="18">Captured from the built dist/index.js renderer</text>
  <text x="840" y="250" fill="#c4b5fd" font-family="Consolas,monospace" font-size="22">Codex CLI 0.172.0 • shared renderer</text>
  <text x="840" y="308" fill="#f8fafc" font-family="Consolas,monospace" font-size="22">$ codex statusline host contract</text>
  <rect x="835" y="350" width="650" height="100" rx="10" fill="#111827" stroke="#334155"/>
  <text x="855" y="408" fill="#c4b5fd" font-family="Consolas,monospace" font-size="22">GPT High | Ctx 0% | 5h 47%</text>
  <text x="855" y="438" fill="#facc15" font-family="Consolas,monospace" font-size="22">status-model  ·  status-usage  ·  status-limit</text>
  <text x="840" y="500" fill="#fbbf24" font-family="Segoe UI,Arial,sans-serif" font-size="18">Host integration is experimental/pending in Codex CLI</text>
  <text x="110" y="610" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="18">Claude panel: actual local execution</text>
  <text x="840" y="610" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="18">Codex panel: verified renderer contract, not a claimed live plugin install</text>
</svg>
